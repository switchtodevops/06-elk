services:

  # ---------------------------------------------------------
  # Creates the CA and certificates used by Elasticsearch
  # nodes for transport-layer TLS.
  #
  # It also configures the kibana_system password.
  # ---------------------------------------------------------
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: elastic-setup
    user: "0"

    volumes:
      - certs:/usr/share/elasticsearch/config/certs

    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD}

    command: >
      bash -c '
        if [ -z "$${ELASTIC_PASSWORD}" ]; then
          echo "ELASTIC_PASSWORD is not configured in .env";
          exit 1;
        fi;

        if [ -z "$${KIBANA_PASSWORD}" ]; then
          echo "KIBANA_PASSWORD is not configured in .env";
          exit 1;
        fi;

        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating certificate authority";

          bin/elasticsearch-certutil ca \
            --silent \
            --pem \
            -out config/certs/ca.zip;

          unzip config/certs/ca.zip \
            -d config/certs;
        fi;

        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certificates for es01, es02 and es03";

          echo -ne \
          "instances:\n"\
          "  - name: es01\n"\
          "    dns:\n"\
          "      - es01\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "  - name: es02\n"\
          "    dns:\n"\
          "      - es02\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "  - name: es03\n"\
          "    dns:\n"\
          "      - es03\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          > config/certs/instances.yml;

          bin/elasticsearch-certutil cert \
            --silent \
            --pem \
            --in config/certs/instances.yml \
            --ca-cert config/certs/ca/ca.crt \
            --ca-key config/certs/ca/ca.key \
            -out config/certs/certs.zip;

          unzip config/certs/certs.zip \
            -d config/certs;
        fi;

        echo "Applying certificate permissions";

        chown -R root:root config/certs;

        find config/certs \
          -type d \
          -exec chmod 750 {} \;;

        find config/certs \
          -type f \
          -exec chmod 640 {} \;;

        echo "Waiting for Elasticsearch";

        until curl \
          --silent \
          --output /dev/null \
          --user "elastic:$${ELASTIC_PASSWORD}" \
          http://es01:9200;
        do
          sleep 10;
        done;

        echo "Elasticsearch is available";
        echo "Configuring kibana_system password";

        until curl \
          --silent \
          --output /dev/null \
          --write-out "%{http_code}" \
          --user "elastic:$${ELASTIC_PASSWORD}" \
          --request POST \
          http://es01:9200/_security/user/kibana_system/_password \
          --header "Content-Type: application/json" \
          --data "{\"password\":\"$${KIBANA_PASSWORD}\"}" \
          | grep -q "200";
        do
          echo "Waiting to configure kibana_system password";
          sleep 10;
        done;

        echo "kibana_system password configured successfully";
      '

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f config/certs/es01/es01.crt"
        ]
      interval: 2s
      timeout: 5s
      retries: 60

    networks:
      - elastic-network


  # ---------------------------------------------------------
  # Elasticsearch node 1
  # Roles: master, data and ingest
  # ---------------------------------------------------------
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: es01
    hostname: es01
    restart: unless-stopped

    depends_on:
      setup:
        condition: service_healthy

    environment:
      node.name: es01
      cluster.name: ${CLUSTER_NAME}

      node.roles: master,data,ingest,remote_cluster_client

      discovery.seed_hosts: es02,es03
      cluster.initial_master_nodes: es01,es02,es03

      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      bootstrap.memory_lock: "true"

      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"

      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.verification_mode: certificate
      xpack.security.transport.ssl.key: certs/es01/es01.key
      xpack.security.transport.ssl.certificate: certs/es01/es01.crt
      xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt

      xpack.license.self_generated.type: ${LICENSE}

      ES_JAVA_OPTS: ${ES_JAVA_OPTS}

    ports:
      - "${ES_PORT}:9200"

    volumes:
      - certs:/usr/share/elasticsearch/config/certs:ro
      - es01-data:/usr/share/elasticsearch/data

    networks:
      - elastic-network

    mem_limit: ${MEM_LIMIT}

    ulimits:
      memlock:
        soft: -1
        hard: -1

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --silent --fail --user elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s


  # ---------------------------------------------------------
  # Elasticsearch node 2
  # Roles: master, data and ingest
  # ---------------------------------------------------------
  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: es02
    hostname: es02
    restart: unless-stopped

    depends_on:
      setup:
        condition: service_healthy

    environment:
      node.name: es02
      cluster.name: ${CLUSTER_NAME}

      node.roles: master,data,ingest,remote_cluster_client

      discovery.seed_hosts: es01,es03
      cluster.initial_master_nodes: es01,es02,es03

      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      bootstrap.memory_lock: "true"

      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"

      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.verification_mode: certificate
      xpack.security.transport.ssl.key: certs/es02/es02.key
      xpack.security.transport.ssl.certificate: certs/es02/es02.crt
      xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt

      xpack.license.self_generated.type: ${LICENSE}

      ES_JAVA_OPTS: ${ES_JAVA_OPTS}

    ports:
      - "9201:9200"

    volumes:
      - certs:/usr/share/elasticsearch/config/certs:ro
      - es02-data:/usr/share/elasticsearch/data

    networks:
      - elastic-network

    mem_limit: ${MEM_LIMIT}

    ulimits:
      memlock:
        soft: -1
        hard: -1

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --silent --fail --user elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s


  # ---------------------------------------------------------
  # Elasticsearch node 3
  # Roles: master, data and ingest
  # ---------------------------------------------------------
  es03:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: es03
    hostname: es03
    restart: unless-stopped

    depends_on:
      setup:
        condition: service_healthy

    environment:
      node.name: es03
      cluster.name: ${CLUSTER_NAME}

      node.roles: master,data,ingest,remote_cluster_client

      discovery.seed_hosts: es01,es02
      cluster.initial_master_nodes: es01,es02,es03

      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      bootstrap.memory_lock: "true"

      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"

      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.verification_mode: certificate
      xpack.security.transport.ssl.key: certs/es03/es03.key
      xpack.security.transport.ssl.certificate: certs/es03/es03.crt
      xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt

      xpack.license.self_generated.type: ${LICENSE}

      ES_JAVA_OPTS: ${ES_JAVA_OPTS}

    ports:
      - "9202:9200"

    volumes:
      - certs:/usr/share/elasticsearch/config/certs:ro
      - es03-data:/usr/share/elasticsearch/data

    networks:
      - elastic-network

    mem_limit: ${MEM_LIMIT}

    ulimits:
      memlock:
        soft: -1
        hard: -1

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --silent --fail --user elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s


  # ---------------------------------------------------------
  # Kibana
  # ---------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: kibana
    hostname: kibana
    restart: unless-stopped

    depends_on:
      es01:
        condition: service_healthy
      es02:
        condition: service_healthy
      es03:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

    environment:
      SERVER_NAME: kibana
      SERVER_HOST: 0.0.0.0

      ELASTICSEARCH_HOSTS: '["http://es01:9200","http://es02:9200","http://es03:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD}

      XPACK_SECURITY_ENCRYPTIONKEY: kibanaSecurityEncryptionKey123456789
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: kibanaSavedObjectsEncryptionKey12345
      XPACK_REPORTING_ENCRYPTIONKEY: kibanaReportingEncryptionKey12345678

      TELEMETRY_ENABLED: "false"

    ports:
      - "${KIBANA_PORT}:5601"

    volumes:
      - kibana-data:/usr/share/kibana/data

    networks:
      - elastic-network

    mem_limit: 1073741824

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --silent --fail http://localhost:5601/api/status > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s


networks:
  elastic-network:
    driver: bridge


volumes:
  certs:

  es01-data:
  es02-data:
  es03-data:

  kibana-data:
